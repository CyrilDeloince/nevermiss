# Cron horaire NeverMiss — Vercel Hobby ne peut tourner qu'1×/jour,
# donc GitHub Actions appelle /api/cron chaque heure (heure de Paris respectée côté app).
name: nevermiss-cron

on:
  schedule:
    # Toutes les heures (UTC). L'app convertit les horaires en Europe/Paris.
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger NeverMiss cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          URL="${APP_URL:-https://nevermiss-fawn.vercel.app}"
          URL="${URL%/}/api/cron"
          echo "Calling $URL"
          if [ -n "$CRON_SECRET" ]; then
            curl -fsS -X GET "$URL" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "User-Agent: nevermiss-github-cron"
          else
            curl -fsS -X GET "$URL" \
              -H "User-Agent: nevermiss-github-cron"
          fi
